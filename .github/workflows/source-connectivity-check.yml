name: source-connectivity-check

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/source-connectivity-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe zzcargo.com from GitHub-hosted runner
        shell: bash
        run: |
          set -u
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/156.0.0.0 Safari/537.36 Edg/156.0.0.0'
          HOME_CODE=$(curl -4 -sS -L --max-time 25 -A "$UA" \
            -o /tmp/zz-home.html -w '%{http_code}' \
            'https://www.zzcargo.com/airline/1' || true)
          API_CODE=$(curl -4 -sS --max-time 25 -A "$UA" \
            -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' \
            -H 'X-Requested-With: XMLHttpRequest' \
            -H 'Origin: https://www.zzcargo.com' \
            -H 'Referer: https://www.zzcargo.com/airline/1' \
            -H 'Accept: application/json, text/javascript, */*; q=0.01' \
            -H 'Accept-Language: zh-CN,zh;q=0.9' \
            --data 'current=1&flightNo=&execDate=&ioAttr=&agency=&startStationCn=&terminalStationCn=' \
            -o /tmp/zz-api.json -w '%{http_code}' \
            'https://www.zzcargo.com/flightDynamic/skipTo?jstime=1' || true)
          echo "HOME_CODE=$HOME_CODE API_CODE=$API_CODE"
          echo '--- home head ---'
          head -c 200 /tmp/zz-home.html 2>/dev/null || true
          echo
          echo '--- api head ---'
          head -c 300 /tmp/zz-api.json 2>/dev/null || true
          echo
          if [ "$HOME_CODE" != "200" ] || [ "$API_CODE" != "200" ]; then
            echo "::error::Source unreachable from GitHub-hosted runner"
            exit 1
          fi
          jq -e '.code == 200 and (.data.records | length) > 0' /tmp/zz-api.json
